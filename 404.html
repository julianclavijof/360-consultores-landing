:root{

/* Hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-32);padding:var(--sp-96) 0 var(--sp-48);overflow:hidden;isolation:isolate;background:linear-gradient(170deg,#ECE9FB 0%,#EAF1FD 55%,#F4F3FA 100%)}

  }

/* Cabecera */
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;transition:transform 600ms var(--ease)}
.site-header::before{content:"";position:absolute;inset:0;background:rgba(244,243,250,.82);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);box-shadow:0 1px 0 rgba(18,32,74,.07),0 12px 32px -24px rgba(18,32,74,.35);opacity:0;transition:opacity 400ms var(--ease)}

.site-header.is-hidden{transform:translateY(-100%)}
.bar{position:relative;display:flex;align-items:center;gap:var(--sp-16);max-width:1200px;height:72px;margin-inline:auto;padding-inline:var(--gutter);transition:height 500ms var(--ease)}

.brand{display:flex;align-items:center;flex:none;position:relative}

/* Cifras del hero */

/* Hilo conductor vertical */
main{position:relative}
.thread{position:absolute;inset:0;pointer-events:none;z-index:20;--rx:8px;--ty:0px;--th:0px;--p:0}
.thread-track,.thread-fill{position:absolute;left:var(--rx);top:var(--ty);height:var(--th);width:2px;margin-left:-1px;border-radius:2px}
.thread-track{background:rgba(124,92,255,.16)}

.thread-node.on{background:var(--violet);transform:scale(1.15);box-shadow:0 0 0 4px rgba(124,92,255,.18),0 0 16px rgba(124,92,255,.6)}
